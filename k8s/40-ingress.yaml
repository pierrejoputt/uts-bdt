apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: uts-ingress }
spec:
  ingressClassName: nginx
  rules:
  - host: auth.lokal
    http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: keycloak, port: { number: 8080 } } } }] }
  - host: api.lokal
    http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: api, port: { number: 8000 } } } }] }
