apiVersion: v1
kind: Secret
metadata: { name: db-secret }
type: Opaque
stringData:
  POSTGRES_PASSWORD: "ganti-ini"
  REPL_PASSWORD: "ganti-ini-juga"
---
apiVersion: v1
kind: ConfigMap
metadata: { name: app-config }
data:
  DB_PRIMARY_HOST: postgres-primary
  DB_REPLICA_HOST: postgres-replica
  DB_NAME: appdb
  DB_USER: postgres
  OIDC_ISSUER: http://auth.lokal/realms/uts
  JWKS_URL: http://keycloak:8080/realms/uts/protocol/openid-connect/certs
---
# Script init primary + skema SQL, di-mount ke /docker-entrypoint-initdb.d/
apiVersion: v1
kind: ConfigMap
metadata: { name: db-init }
data:
  00-repl.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" <<-EOSQL
      CREATE ROLE replicator WITH REPLICATION LOGIN PASSWORD '${REPL_PASSWORD}';
    EOSQL
    echo "host replication replicator all scram-sha-256" >> "$PGDATA/pg_hba.conf"
  01-schema.sql: |
    CREATE TABLE IF NOT EXISTS inference_history (
      id SERIAL PRIMARY KEY,
      user_sub TEXT NOT NULL,
      input JSONB NOT NULL,
      prediction INT NOT NULL,
      created_at TIMESTAMPTZ DEFAULT now()
    );
