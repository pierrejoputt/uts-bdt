# StatefulSet 2 replika: postgres-0 = primary, postgres-1 = replica
apiVersion: v1
kind: Service
metadata: { name: postgres-headless }
spec:
  clusterIP: None                 # Headless Service -> DNS per-pod
  publishNotReadyAddresses: true
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres-primary }
spec:
  selector: { statefulset.kubernetes.io/pod-name: postgres-0 }
  ports: [{ port: 5432 }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres-replica }
spec:
  selector: { statefulset.kubernetes.io/pod-name: postgres-1 }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres }
spec:
  serviceName: postgres-headless
  replicas: 2
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
      - name: postgres
        image: postgres:16
        envFrom: [{ secretRef: { name: db-secret } }]
        env:
        - { name: POSTGRES_DB, value: appdb }
        - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
        command: ["bash", "-c"]
        args:
        - |
          ORD=${HOSTNAME##*-}
          if [ "$ORD" = "0" ]; then
            exec docker-entrypoint.sh postgres -c wal_level=replica \
              -c max_wal_senders=5 -c hot_standby=on -c listen_addresses='*'
          else
            mkdir -p "$PGDATA"
            if [ -z "$(ls -A "$PGDATA" 2>/dev/null)" ]; then
              until pg_isready -h postgres-0.postgres-headless -U postgres; do sleep 2; done
              chown postgres:postgres "$PGDATA"
              PGPASSWORD=$REPL_PASSWORD gosu postgres pg_basebackup -h postgres-0.postgres-headless \
                -U replicator -D "$PGDATA" -Fp -Xs -P -R
              chmod 700 "$PGDATA"
            fi
            exec docker-entrypoint.sh postgres
          fi
        ports: [{ containerPort: 5432 }]
        readinessProbe:
          # TCP (-h 127.0.0.1) supaya baru "Ready" setelah server final jalan, bukan server init sementara
          exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres"] }
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - { name: data, mountPath: /var/lib/postgresql/data }
        - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
      - name: init
        configMap:
          name: db-init
          defaultMode: 0755
  volumeClaimTemplates:           # PVC dinamis per pod
  - metadata: { name: data }
    spec:
      accessModes: ["ReadWriteOnce"]
      resources: { requests: { storage: 1Gi } }
